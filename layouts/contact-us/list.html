<!-- 
 uses header/footer code copied from "baseof.html" rather than calling "define main" shortcode 
-->
<!DOCTYPE html>
<html lang="{{ .Language.Lang }}">
    {{- partial "head.html" . -}}
    <body class="{{ urlize .Type }} page-{{ .Kind }}">
        {{- partial "accessibility.html" . -}}
        {{- partial "header.html" . -}}
        
        <section class="hero">
          <div class="container hero-inner">
            <h1>{{ .Title }}</h1>
          </div>
        </section>
        
        <section id="content" class="container wrap" {{ if .IsPage }}data-pagefind-body{{ end }}>
          {{ .Content }}
        </section>

        {{- partial "footer.html" . -}}
    </body>
</html>
